[project]
name = "appliance-presets"
version = "0.1.0"
description = "Home Assistant integration: named multi-step appliance programmes (staged presets) for Home Connect."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "mvheimburg" }]

[project.urls]
Homepage = "https://github.com/mvheimburg/appliance-presets"
Issues = "https://github.com/mvheimburg/appliance-presets/issues"

# The version above is the release source of truth. CI verifies that
# custom_components/appliance_presets/manifest.json carries the same version,
# and the release workflow tags v<version> when it changes on main.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
